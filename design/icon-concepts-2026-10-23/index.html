<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Workbench · 红蓝交融图标候选</title>
<style>
:root{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#243b57;background:#edf2f8}*{box-sizing:border-box}body{margin:0;padding:36px;max-width:1320px;margin-inline:auto}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;margin-bottom:28px}h1{font-size:30px;margin:6px 0 10px;font-weight:620}header p{font-size:14px;line-height:1.8;color:#65778e;margin:0}.draft{font-size:12px;border:1px solid #c7d5e7;background:#fff;padding:8px 12px;white-space:nowrap;border-radius:6px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0}.toolbar button,button.open,dialog button{font:inherit;border:1px solid #c7d5e7;background:white;color:#365d98;border-radius:6px;padding:8px 13px;cursor:pointer}.toolbar button[aria-pressed="true"]{background:#365d98;color:#fff;border-color:#365d98}button:focus-visible{outline:3px solid #8db8f1;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.candidate{background:#fff;border:1px solid #dce5f0;border-radius:14px;overflow:hidden}.stage{display:flex;align-items:center;justify-content:center;min-height:300px;padding:24px;background:#e6edf6}.stage img{width:100%;max-width:280px;height:auto;display:block}.candidate h2{font-size:19px;margin:0 0 8px}.copy{padding:22px}.copy p{font-size:13px;line-height:1.8;color:#65778e;min-height:48px;margin:0 0 16px}.sizes{display:flex;align-items:center;gap:22px;min-height:102px;background:#f3f6fb;padding:16px 20px;border-top:1px solid #e6edf6}.sizes figure{display:flex;align-items:center;flex-direction:column;justify-content:flex-end;gap:9px;margin:0}.sizes figcaption{font-size:11px;color:#65778e}.context-dark .stage,.context-dark .sizes{background:#101c2d}.context-dark .sizes figcaption{color:#b0c2db}.original{display:flex;gap:18px;align-items:center;margin-top:28px;padding:18px 22px;border:1px solid #dce5f0;background:#fff;border-radius:10px}.original img{width:64px;height:64px}.original h2{font-size:14px;margin:0 0 5px}.original p{font-size:12px;color:#65778e;line-height:1.8;margin:0}dialog{border:1px solid #cad7e7;border-radius:16px;padding:20px;max-width:min(90vw,780px);background:#edf2f8;color:#243b57}dialog::backdrop{background:#071324b8}dialog .dialog-head{display:flex;justify-content:space-between;align-items:center;gap:20px}dialog h2{font-size:18px;margin:0}dialog img{display:block;width:100%;max-height:72vh;object-fit:contain;margin-top:16px}footer{font-size:12px;color:#65778e;line-height:1.8;margin-top:24px}footer a{color:#365d98}@media(max-width:900px){body{padding:22px}.grid{grid-template-columns:1fr}.candidate{display:grid;grid-template-columns:minmax(200px,1fr) 1fr}.stage{grid-row:span 2;min-height:240px}.copy{padding:20px}.sizes{border-top:0}.copy p{min-height:0}header{flex-wrap:wrap}}@media(max-width:540px){.candidate{display:block}.stage{min-height:260px}.sizes{border-top:1px solid #e6edf6}.draft{white-space:normal}}
</style>
<header><div><p>Agent Workbench · 图标设计预览</p><h1>红蓝交融</h1><p>保留无限环与两侧互联线，以红色热感、冰蓝冷光和交叉体积表达科技感。</p></div><span class="draft">暂存方案 · 尚未选定</span></header>
<div class="toolbar" aria-label="预览背景"><span>查看小尺寸与不同背景</span><button type="button" data-context="light" aria-pressed="true">浅色界面</button><button type="button" data-context="dark" aria-pressed="false">深色界面</button></div>
<main class="grid" id="variants"></main>
<section class="original"><img src="reference-current.png" alt="当前正式应用图标"><div><h2>当前图标参考</h2><p>正式图标仍使用现有版本。以上均为内置 ImageGen 生成的材质候选，供选择与继续细化。</p></div></section>
<footer>点击“放大预览”查看原图；24 / 32 / 64 像素样张通过页面缩放展示。<a href="prompts.json">完整提示词与设计说明</a>随稿保存。</footer>
<dialog id="preview"><div class="dialog-head"><h2 id="preview-title"></h2><button type="button" id="close-preview">关闭</button></div><img id="preview-image" alt=""></dialog>
<script>
const variants=[{id:'A',name:'冰火晶体',file:'A-crystal-confluence.png',description:'饱满晶体与内部反射，红蓝能量在交叉处汇聚。'},{id:'B',name:'钛金双流',file:'B-titanium-dualflow.png',description:'红色金属主体、立体侧壁与冰蓝光槽，偏精密硬件质感。'},{id:'C',name:'熔芯光纤',file:'C-optical-molten-core.png',description:'红色透明光导包裹冰蓝能量芯，强调互联与流动。'}];
const main=document.getElementById('variants');
variants.forEach(v=>{const article=document.createElement('article');article.className='candidate';article.innerHTML=`<div class="stage"><img src="${v.file}" alt="${v.name}图标候选"></div><div class="copy"><h2>${v.id} · ${v.name}</h2><p>${v.description}</p><button type="button" class="open">放大预览 ${v.id}</button></div><div class="sizes" aria-label="${v.name}的小尺寸展示">${[24,32,64].map(size=>`<figure><img src="${v.file}" width="${size}" height="${size}" alt="${size}像素样张"><figcaption>${size}px</figcaption></figure>`).join('')}</div>`;article.querySelector('.open').addEventListener('click',()=>{document.getElementById('preview-title').textContent=v.id+' · '+v.name;document.getElementById('preview-image').src=v.file;document.getElementById('preview-image').alt=v.name+'放大预览';document.getElementById('preview').showModal()});main.append(article)});
document.querySelectorAll('[data-context]').forEach(button=>button.addEventListener('click',()=>{document.body.classList.toggle('context-dark',button.dataset.context==='dark');document.querySelectorAll('[data-context]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));
document.getElementById('close-preview').addEventListener('click',()=>document.getElementById('preview').close());
</script>
</html>
